name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: releasedesk
          POSTGRES_PASSWORD: releasedesk
          POSTGRES_DB: releasedesk_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U releasedesk -d releasedesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://releasedesk:releasedesk@127.0.0.1:5432/releasedesk_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @releasedesk/contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: releasedesk:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose up -d --wait --wait-timeout 120
      - run: curl --fail http://localhost:3000/api/health
      - if: always()
        run: docker compose down
